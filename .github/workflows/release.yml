name: Release

# Publishes a GitHub release whenever a version tag is pushed:
#   npm version patch   # or: git tag v0.4.3
#   git push --follow-tags
# The release tarball is built and packed in CI so it always matches the tag.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Pack
        id: pack
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm pack
          echo "tarball=az-where-${version}.tgz" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Automated release for ${GITHUB_REF_NAME}. See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for details." \
            "${{ steps.pack.outputs.tarball }}"
